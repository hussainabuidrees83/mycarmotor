<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">🚗 {{ site.Title }}</a>
    <nav>
      {{ range .AllTranslations }}{{ if ne .Language.Lang site.Language.Lang }}
        <a class="lang" href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}">{{ .Language.Label }}</a>
      {{ end }}{{ end }}
      <a class="btn btn-sm btn-wa" href="https://wa.me/{{ site.Params.whatsapp }}">{{ i18n "whatsapp" }}</a>
    </nav>
  </div>
</header>
