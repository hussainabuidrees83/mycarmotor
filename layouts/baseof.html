<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" dir="{{ or site.Language.Direction "ltr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ i18n "tagline" }}{{ end }}">
  {{ if and .IsPage (eq .Type "cars") }}<meta property="og:image" content="{{ (index (partial "car-images.html" .) 0).large | absURL }}">{{ end }}
  <meta property="og:title" content="{{ .Title }}">
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body class="{{ if and .IsPage (eq .Type "cars") }}page-car{{ end }}">
  {{ partial "header.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/app.js" | relURL }}" defer></script>
</body>
</html>
